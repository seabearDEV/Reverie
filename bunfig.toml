[test]
# `bun test` is invoked via `bun run test`, whose --parallel runs the files
# in worker processes and implies --isolate (mirrors vitest's default
# isolate:true). Without isolation, mocks set in one file leak into the
# next. bunfig.toml doesn't expose either as a key, so the flag lives in
# the package.json script.
preload = ["./src/__tests__/_setup.ts"]
