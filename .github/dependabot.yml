# Leg A continuous scanning (#131, docs/security/release-process.md).
# Version updates only — security alerts + automated security fixes are
# repo settings, enabled alongside this file.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint's peer range caps at TS <6.1 — no released version
      # supports TS 7. Revisit when typescript-eslint ships TS-7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and codeql-action/analyze are separate Dependabot
      # dependencies but MUST run at the same version — a split bump fails the
      # analyze job with "Loaded a configuration file for version X, but
      # running version Y". Group them so they always land in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
