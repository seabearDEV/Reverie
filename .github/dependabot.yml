# Leg A continuous scanning (#131, docs/security/release-process.md).
# Version updates only — security alerts + automated security fixes are
# repo settings, enabled alongside this file.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint's peer range caps at TS <6.1 — no released version
      # supports TS 7. Revisit when typescript-eslint ships TS-7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
