name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: rvr-linux-x64
          - runner: ubuntu-24.04-arm
            binary: rvr-linux-arm64
          - runner: windows-latest
            binary: rvr-win-x64.exe

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.binary }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun scripts/sea-build.js ${{ matrix.binary }}

      - name: Smoke test
        shell: bash
        run: |
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            ./dist/${{ matrix.binary }} --version
          else
            chmod +x ./dist/${{ matrix.binary }}
            ./dist/${{ matrix.binary }} --version
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}

  build-macos:
    runs-on: macos-latest
    name: Build rvr-macos-universal

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # ── arm64 slice (native on macos-latest) ─────────────────────────────
      - name: Build arm64 slice
        run: bun scripts/sea-build.js rvr-macos-arm64

      - name: Smoke test arm64
        run: |
          chmod +x dist/rvr-macos-arm64
          ./dist/rvr-macos-arm64 --version

      # ── x64 slice (bun cross-compiles natively, no Node x64 tarball needed) ──
      - name: Build x64 slice
        run: bun scripts/sea-build.js rvr-macos-x64

      - name: Smoke test x64
        run: |
          chmod +x dist/rvr-macos-x64
          arch -x86_64 ./dist/rvr-macos-x64 --version

      # ── Universal binary ─────────────────────────────────────────────────
      - name: Create universal binary
        run: |
          lipo -create dist/rvr-macos-arm64 dist/rvr-macos-x64 -output dist/rvr-macos-universal
          codesign --remove-signature dist/rvr-macos-universal
          codesign --sign - dist/rvr-macos-universal
          file dist/rvr-macos-universal

      - name: Smoke test universal (arm64)
        run: ./dist/rvr-macos-universal --version

      - name: Smoke test universal (x86_64)
        run: arch -x86_64 ./dist/rvr-macos-universal --version

      - uses: actions/upload-artifact@v7
        with:
          name: rvr-macos-universal
          path: dist/rvr-macos-universal

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Detect prerelease
        id: prerelease
        run: |
          # SemVer prerelease tags contain a `-` after the patch number
          # (e.g. v1.11.1-beta.0, v1.12.0-rc.1). Stable tags are pure
          # MAJOR.MINOR.PATCH like v1.11.1.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # v3 (Node 24-native) wrapped in a one-shot retry. v1.13.0 hit a
      # transient "Error creating policy" from GitHub's storage API
      # mid-upload, leaving the release in draft. A debug-tag rerun on
      # v3 with ACTIONS_STEP_DEBUG enabled could not reproduce it, so
      # we treat it as a transient API hiccup that v3's stream semantics
      # may surface more visibly than v2 did. The retry is idempotent
      # because v3 defaults overwrite_files: true. Tracked in #96.
      - name: Create Release (attempt 1)
        id: release
        uses: softprops/action-gh-release@v3.0.0
        continue-on-error: true
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
          files: artifacts/*

      - name: Create Release (retry on transient failure)
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.prerelease == 'true' }}
          files: artifacts/*

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    name: Update Homebrew Tap

    steps:
      - name: Get version + channel from tag
        id: version
        run: |
          # Strip the leading "v" so $version is bare semver.
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Prerelease tags (anything with a `-`) ship to the @beta formula
          # so they don't bump stable users on `brew upgrade`. Stable tags
          # ship to the canonical rvr formula. Beta installs use a distinct
          # binary name (`rvr-beta`) so both formulas can coexist on a
          # machine without symlink conflicts.
          if [[ "${version}" == *-* ]]; then
            # Beta channel uses `rvr-beta.rb` (NOT `rvr@beta.rb`).
            # Homebrew's `Formulary.class_s` only handles `@<digit>`-versioned
            # formulas (like `python@3.11`, `node@20`); it does NOT handle
            # `@<letter>` like `@beta`. Trying to load `rvr@beta.rb` errors
            # with "Expected to find class Rvr@beta" — which isn't even a
            # valid Ruby identifier. The dash form sidesteps brew's class_s
            # entirely: `rvr-beta.rb` -> `RvrBeta` (separator + capitalize).
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "formula_class=RvrBeta" >> "$GITHUB_OUTPUT"
            echo "formula_file=rvr-beta.rb" >> "$GITHUB_OUTPUT"
            echo "binary_name=rvr-beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "formula_class=Rvr" >> "$GITHUB_OUTPUT"
            echo "formula_file=rvr.rb" >> "$GITHUB_OUTPUT"
            echo "binary_name=rvr" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release binaries
        run: |
          base="https://github.com/seabearDEV/reverie/releases/download/${GITHUB_REF_NAME}"
          for bin in rvr-macos-universal rvr-linux-x64 rvr-linux-arm64; do
            curl -fsSL "$base/$bin" -o "$bin"
          done

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "macos_universal=$(sha256sum rvr-macos-universal | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum rvr-linux-x64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum rvr-linux-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: seabearDEV/homebrew-reverie
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-reverie

      - name: Generate formula
        env:
          RVR_VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          FORMULA_CLASS: ${{ steps.version.outputs.formula_class }}
          FORMULA_FILE: ${{ steps.version.outputs.formula_file }}
          BINARY_NAME: ${{ steps.version.outputs.binary_name }}
          SHA_MACOS_UNIVERSAL: ${{ steps.sha.outputs.macos_universal }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          mkdir -p homebrew-reverie/Formula
          cat > "homebrew-reverie/Formula/$FORMULA_FILE" << EOF
          class $FORMULA_CLASS < Formula
            desc "Bicameral memory for AI-assisted development — CLI + MCP server bootstrapping persistent project context across sessions"
            homepage "https://github.com/seabearDEV/reverie"
            version "$RVR_VERSION"
            license "MIT"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              url "https://github.com/seabearDEV/reverie/releases/download/v$RVR_VERSION/rvr-macos-universal"
              sha256 "$SHA_MACOS_UNIVERSAL"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/seabearDEV/reverie/releases/download/v$RVR_VERSION/rvr-linux-arm64"
                sha256 "$SHA_LINUX_ARM64"
              else
                url "https://github.com/seabearDEV/reverie/releases/download/v$RVR_VERSION/rvr-linux-x64"
                sha256 "$SHA_LINUX_X64"
              end
            end

            def install
              binary = Dir.glob("rvr-*").first
              bin.install binary => "$BINARY_NAME"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/$BINARY_NAME --version")
            end
          end
          EOF

      - name: Clean up obsolete beta formula
        if: steps.version.outputs.channel == 'beta'
        working-directory: homebrew-reverie
        run: |
          # v1.11.1-beta.0 and beta.1 wrote `Formula/rvr@beta.rb`, which
          # brew can't load (its class_s regex only handles @<digit>-versioned
          # formulas). beta.2 renames to `rvr-beta.rb`. Remove the broken
          # file from the tap so users running `brew update` stop seeing
          # the load error.
          if [[ -f Formula/rvr@beta.rb ]]; then
            git rm Formula/rvr@beta.rb
          fi

      - name: Push updated formula
        working-directory: homebrew-reverie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA_FILE"
          git commit -m "Update $CHANNEL channel to $RVR_VERSION"
          git push
        env:
          RVR_VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          FORMULA_FILE: ${{ steps.version.outputs.formula_file }}
